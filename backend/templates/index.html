{% extends "base.html" %}

{% block title %}eBird Explorer - Find Birds Near You{% endblock %}

{% block content %}
<section class="hero-search">
    <p class="hero-tagline">Discover what birds are around you</p>
    <h2>Recent sightings near...</h2>
    <form action="/search" method="get" class="search-form">
        <div class="search-row">
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter a city, ZIP, or address"
                required
                autofocus
                class="search-input"
            >
            <select id="radius" name="radius" class="search-select">
                <option value="2">2 mi</option>
                <option value="5">5 mi</option>
                <option value="10" selected>10 mi</option>
                <option value="15">15 mi</option>
                <option value="25">25 mi</option>
            </select>
            <select id="days" name="days" class="search-select">
                <option value="7">7 days</option>
                <option value="14" selected>14 days</option>
                <option value="30">30 days</option>
            </select>
            <button type="submit">Search</button>
        </div>
    </form>
</section>

<div class="home-divider">
    <span>or</span>
</div>

<section class="hero-search species-search-section">
    <h2>Find a specific species</h2>
    <form action="/species" method="get" class="search-form">
        <div class="search-row species-row">
            <div class="autocomplete-wrapper">
                <input
                    type="text"
                    id="species-input"
                    placeholder="Start typing a species name..."
                    autocomplete="off"
                    class="search-input"
                >
                <input type="hidden" id="species" name="species">
                <div id="autocomplete-results" class="autocomplete-results"></div>
            </div>
            <span class="search-near">near</span>
            <input
                type="text"
                id="species-location"
                name="location"
                placeholder="Location"
                class="search-input location-input"
            >
            <button type="submit">Find</button>
        </div>
    </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script src="/static/autocomplete.js"></script>
{% endblock %}
