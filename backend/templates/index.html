{% extends "base.html" %}

{% block title %}eBird Explorer - Find Birds Near You{% endblock %}

{% block content %}
<section class="hero-search">
    <p class="hero-tagline">Discover what birds are around you</p>
    <h2>Recent sightings near...</h2>
    <form action="/search" method="get" class="search-form">
        <div class="search-row">
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter a city, ZIP, or address"
                required
                autofocus
                class="search-input"
            >
            <select id="radius" name="radius" class="search-select">
                <option value="2">2 mi</option>
                <option value="5">5 mi</option>
                <option value="10" selected>10 mi</option>
                <option value="15">15 mi</option>
                <option value="25">25 mi</option>
            </select>
            <select id="days" name="days" class="search-select">
                <option value="7">7 days</option>
                <option value="14" selected>14 days</option>
                <option value="30">30 days</option>
            </select>
            <button type="submit">Search</button>
        </div>
    </form>
</section>

<div class="home-divider">
    <span>or</span>
</div>

<section class="hero-search species-search-section">
    <h2>Find a specific species</h2>
    <form action="/species" method="get" class="search-form">
        <div class="search-row species-row">
            <div class="autocomplete-wrapper">
                <input
                    type="text"
                    id="species-input"
                    placeholder="Start typing a species name..."
                    autocomplete="off"
                    class="search-input"
                >
                <input type="hidden" id="species" name="species">
                <div id="autocomplete-results" class="autocomplete-results"></div>
            </div>
            <span class="search-near">near</span>
            <input
                type="text"
                id="species-location"
                name="location"
                placeholder="Location"
                class="search-input location-input"
            >
            <button type="submit">Find</button>
        </div>
    </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
(function() {
    const input = document.getElementById('species-input');
    const hidden = document.getElementById('species');
    const results = document.getElementById('autocomplete-results');
    if (!input) return;

    let taxonomy = null;
    let fuse = null;
    let debounceTimer;
    let loading = false;

    // Preload taxonomy on focus
    async function loadTaxonomy() {
        if (taxonomy || loading) return;
        loading = true;
        try {
            const response = await fetch('/api/taxonomy');
            taxonomy = await response.json();
            fuse = new Fuse(taxonomy, {
                keys: ['name', 'sciName'],
                threshold: 0.4,
                distance: 100,
                ignoreLocation: true,
                includeScore: true
            });
        } catch (e) {
            console.error('Failed to load taxonomy:', e);
        }
        loading = false;
    }

    input.addEventListener('focus', loadTaxonomy);

    function search(query) {
        if (!taxonomy || !fuse) return [];

        const q = query.toLowerCase();

        // Find exact prefix matches
        const prefixMatches = taxonomy.filter(s =>
            s.name.toLowerCase().startsWith(q) ||
            s.sciName.toLowerCase().startsWith(q)
        ).slice(0, 5);

        // Get fuzzy matches
        const fuzzyResults = fuse.search(query, { limit: 15 });
        const fuzzyMatches = fuzzyResults
            .map(r => r.item)
            .filter(item => !prefixMatches.some(p => p.code === item.code));

        // Combine: prefix first, then fuzzy
        const combined = [...prefixMatches, ...fuzzyMatches].slice(0, 10);
        return combined;
    }

    input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const q = this.value.trim();

        if (q.length < 2) {
            results.innerHTML = '';
            results.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(() => {
            if (!taxonomy) {
                results.innerHTML = '<div class="autocomplete-item no-results">Loading species list...</div>';
                results.style.display = 'block';
                loadTaxonomy().then(() => {
                    if (input.value.trim().length >= 2) {
                        input.dispatchEvent(new Event('input'));
                    }
                });
                return;
            }

            const matches = search(q);

            if (matches.length === 0) {
                results.innerHTML = '<div class="autocomplete-item no-results">No species found</div>';
            } else {
                results.innerHTML = matches.map(s =>
                    `<div class="autocomplete-item" data-code="${s.code}" data-name="${s.name}">
                        <span class="species-common">${s.name}</span>
                        <span class="species-sci">${s.sciName}</span>
                    </div>`
                ).join('');
            }
            results.style.display = 'block';
        }, 150);
    });

    results.addEventListener('click', function(e) {
        const item = e.target.closest('.autocomplete-item');
        if (item && item.dataset.code) {
            input.value = item.dataset.name;
            hidden.value = item.dataset.code;
            results.style.display = 'none';
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.autocomplete-wrapper')) {
            results.style.display = 'none';
        }
    });
})();
</script>
{% endblock %}
